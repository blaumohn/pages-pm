services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD fehlt}
      POSTGRES_DB: pages_pm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pages_pm_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pages_pm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pages_pm_data:
